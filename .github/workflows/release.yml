name: Release

on:
  push:
    branches: [main]

# release-please opens (and keeps updating) a release PR from the Conventional Commits on
# main. Merging that PR bumps package.json, writes CHANGELOG.md, tags vX.Y.Z and publishes a
# GitHub Release.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only for the one job that tags and opens PRs.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
