name: Release

on:
  push:
    branches: [main]

# release-please opens (and keeps updating) a release PR from the Conventional Commits on
# main. Merging that PR bumps package.json, writes CHANGELOG.md, tags vX.Y.Z and publishes a
# GitHub Release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
